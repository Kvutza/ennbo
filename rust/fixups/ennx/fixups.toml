buildscript.run = false

['cfg(target_os = "macos")']
features = ["metal"]
extra_deps = ["//buck2/accelerators:metal"]

['cfg(target_os = "linux")']
features = ["opencl"]
extra_deps = ["//buck2/accelerators:opencl3"]

[[cxx_library]]
name = "faiss_bridge"
srcs = ["src/faiss_bridge.cpp"]
compiler_flags = [
  "-std=c++17",
  "-Wno-deprecated-declarations",
]
deps = ["//buck2/native:faiss"]
