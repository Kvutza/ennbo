[package]
name = "ennx-py"
version.workspace = true
edition.workspace = true
build = "src/ennx_py_build.rs"
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Python bindings for ENN core algorithms"

[lib]
name = "ennx_rust"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
ennx = { workspace = true }

[dependencies]
ennx = { workspace = true }
ndarray = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true }
rand = { workspace = true }

[features]
default = []
metal = ["ennx/metal"]
opencl = ["ennx/opencl"]
