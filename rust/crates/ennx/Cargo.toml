[package]
name = "ennx"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Epistemic Nearest Neighbor Bayesian Optimization"
readme = "README.md"
build = "src/ennx_build.rs"

[dependencies]
bpann = { path = "../bpann" }
metal = { version = "0.33.0", optional = true }
ndarray = { workspace = true }
ndarray-linalg = { workspace = true }
opencl3 = { version = "0.12.3", optional = true }
rand = "0.8"
rayon = "1.10"
sobol = "1.0.2"
thiserror = { workspace = true }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
usearch = { version = "2.26", optional = true, default-features = false }

[build-dependencies]
cc = "1.2"

[features]
default = []
metal = ["dep:metal"]
opencl = ["dep:opencl3"]
usearch = ["dep:usearch"]
usearch-numkong = ["usearch", "usearch/numkong"]

[dev-dependencies]
approx = "0.5"
numpy = "0.22"
rand_chacha = "0.3"
tempfile = "3"
