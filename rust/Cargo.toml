[workspace]
members = [
    "crates/bpann",
    "crates/ennx",
    "crates/ennx-py",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["ENNX Contributors"]
repository = "https://github.com/Kvutza/ennx"
keywords = ["bayesian", "optimization", "ENN", "turbo", "turbo-enn"]
categories = ["science", "simulation"]

[workspace.dependencies]
ennx = { path = "crates/ennx", default-features = false }
ndarray = "0.16"
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"] }
rand = "0.8"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
