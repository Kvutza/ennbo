name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: latest
          cache: true

      - name: Install environment
        run: pixi install -e ennx

      - name: Run platform build and tests
        run: |
          pixi run -e ennx buck2-build
          pixi run -e ennx buck2-test

      - name: Build wheel
        run: pixi run -e ennx buck2-wheel

      - name: Collect release artifacts
        run: |
          mkdir -p release
          find buck-out/release -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          cp README LICENSE NOTICE release/
          test -n "$(find release -type f -print -quit)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ennx-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
